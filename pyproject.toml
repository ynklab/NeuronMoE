[project]
name = "neuronmoe"
version = "0.1.0"
description = "Neuron-guided mixture-of-experts pipeline for multilingual LLM extension"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "accelerate>=0.23.0",
    "jsonlines>=4.0.0",
    "matplotlib>=3.3.4",
    "nltk>=3.7",
    "numpy>=1.26.0,<3",
    "pandas>=1.3.4,<3",
    "protobuf>=4.24.3,<6",
    "pyprg==0.1.1b7",
    "scikit-learn>=0.24.2,<2",
    "scipy>=1.5.4,<2",
    "sentencepiece>=0.1.99",
    "torch>=2.0.1",
    "tqdm>=4.61.0",
    "transformers==4.45.0",
]

[project.optional-dependencies]
training = [
    "datasets>=2.0.0",
    "deepspeed>=0.15.4",
    "evaluate>=0.4.0",
    "gradio>=3.50.2,<4",
    "hf-transfer>=0.1.9",
    "rouge-score>=0.1.2",
    "sacrebleu>=2.5.1",
    "seaborn>=0.13.2",
    "trl>=0.7.6",
    "wandb>=0.21.4",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# This project ships scripts and patches, not an importable Python package.
# Declare no top-level modules so setuptools doesn't try to auto-discover
# directories like `data/`, `peft/`, `training/`, etc. as packages.
[tool.setuptools]
py-modules = []

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
]
